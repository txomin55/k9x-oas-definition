        "operationId": "getDogsSecured",
        "tags": [
          "Secured/Dogs/fetch_all"
        ],
        "parameters": [
          {
            "name": "owned",
            "in": "query",
            "description": "When true, returns only the dogs owned by the requesting user. Can be combined with 'created'.",
            "required": false,
            "example": "",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "created",
            "in": "query",
            "description": "When true, returns only the dogs created by the requesting user. Can be combined with 'owned'.",
            "required": false,
            "example": "",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "name",
            "in": "query",
            "description": "Returns only the dogs whose name contains this text, ignoring case. When combined with 'identification', a dog is returned when either of the two matches.",
            "required": false,
            "example": "rex",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "page",
            "in": "query",
            "description": "Zero-based index of the page to return. Ignored unless 'size' is provided.",
            "required": false,
            "example": 0,
            "schema": {
              "type": "integer",
              "format": "int32",
              "minimum": 0
            }
          },
          {
            "name": "size",
            "in": "query",
            "description": "Number of dogs per page. When omitted the whole list is returned in a single page.",
            "required": false,
            "example": 20,
            "schema": {
              "type": "integer",
              "format": "int32",
              "minimum": 1,
              "maximum": 200
            }
          },
          {
            "name": "country",
            "in": "query",
            "description": "Returns only the dogs of this country, by its two-letter code.",
            "required": false,
            "example": "ES",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "identification",
            "in": "query",
            "description": "Returns only the dogs whose identification contains this text, ignoring case. When combined with 'name', a dog is returned when either of the two matches.",
            "required": false,
            "example": "981098",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Dog list returned successfully",
