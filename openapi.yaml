        "summary": "Get the K9X index world ranking",
        "deprecated": false,
        "description": "Everything the world ranking chart draws: how many dogs sit on each band of the K9X index, from the ranking snapshot the index cron rewrites on the 1st and 16th of each month. Only dogs whose current index is 100 or more are charted, and `total` counts just those. Needs no token. With `country`, only the dogs of that country are charted and positions are within it. With `dog`, `highlight` places that dog on the chart; it is null when the dog has no index, sits below 100 or does not belong to the requested country.",
        "operationId": "fetchK9xRanking",
